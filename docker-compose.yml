version: '3.8'

services:
  rk_db:
    image: postgres:16-alpine
    container_name: rk_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alamia_ott}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - alamia-network

  rk_storage:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: rk_storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
    volumes:
      - miniodata:/data
    networks:
      alamia-network:
        aliases:
          - minio

  rk_cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    container_name: rk_cms
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_dev_password}@rk_db:5432/${POSTGRES_DB:-alamia_ott}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-dev_secret_key_change_in_production}
      S3_ENDPOINT: http://minio:9000
      NEXT_PUBLIC_CMS_URL: ${NEXT_PUBLIC_CMS_URL:-https://cmmadmin.alamiaai.com}
      NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-https://cmm.alamiaai.com}
      REDIS_URL: redis://rk_redis:6379
    depends_on:
      - rk_db
      - rk_storage
      - rk_redis
    networks:
      - alamia-network

  rk_web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: rk_web
    environment:
      NEXT_PUBLIC_CMS_URL: ${NEXT_PUBLIC_CMS_URL:-https://cmmadmin.alamiaai.com}
      CMS_INTERNAL_URL: http://rk_cms:4000
    depends_on:
      - rk_cms
    networks:
      - alamia-network

  rk_worker:
    build:
      context: ./workers/ffmpeg
      dockerfile: Dockerfile
    container_name: rk_worker
    environment:
      S3_ENDPOINT: http://minio:9000
      REDIS_URL: redis://rk_redis:6379
      CMS_API_URL: http://rk_cms:4000
    depends_on:
      - rk_storage
      - rk_db
      - rk_redis
      - rk_cms
    networks:
      - alamia-network

  rk_redis:
    image: redis:7-alpine
    container_name: rk_redis
    networks:
      - alamia-network

networks:
  alamia-network:
    external: true

volumes:
  pgdata:
  miniodata:
